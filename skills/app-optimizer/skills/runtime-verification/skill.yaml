schema: skill-manifest/v1
id: lov-runtime-verification
version: "0.2.1"
runtime: skill-runtime/v1
invocation: kit_only
shared_dependencies:
  root: "$KIT_DIR"
  references:
    - "$KIT_DIR/references/evidence-contract.md"
    - "$KIT_DIR/references/runtime-playbook.md"
    - "$KIT_DIR/references/platform-adapters.md"
    - "$KIT_DIR/references/reclamation-policy.md"
    - "$KIT_DIR/references/user-profile.md"
  scripts:
    - "$KIT_DIR/scripts/evidence_report.py"
    - "$KIT_DIR/scripts/profile_store.py"
  output_schema: app-runtime-evidence/v1
  input_schema: app-runtime-evidence/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-runtime-verification
    persist:
      enabled: true
      namespace: skills.lov-runtime-verification
      records_path: skills.lov-runtime-verification.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出验收报告？
      - path: user.timezone
        required: false
        question: before/after 采样与事件关联使用哪个时区？
      - path: workspace.project_roots
        required: false
        question: 需要验收哪个客户端 App、部署或项目根目录？
      - path: skills.lov-runtime-verification.records.target_platform
        required: false
        question: 是否有需要长期沿用的目标平台、设备或浏览器组合？
      - path: skills.lov-runtime-verification.records.acceptance_budget
        required: false
        question: 是否有需要长期沿用的验收预算与阈值？
      - path: skills.lov-runtime-verification.records.reference_workload
        required: false
        question: 是否有需要长期沿用的 reference workload？
  preferences:
    namespace: lov_runtime_verification
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出验收报告？
      - path: performance.report_detail
        required: false
        question: 验收报告需要摘要版还是完整证据版？
      - path: performance.acceptance_budget
        required: false
        question: 是否有共享的性能验收预算？
      - path: performance.target_platform
        required: false
        question: 是否有默认的 desktop、mobile 或 web 验收目标？
  interaction:
    ask_missing: true
    max_questions: 1
