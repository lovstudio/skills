schema: skill-manifest/v1
id: lov-claude-account-migrate
version: "0.1.1"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-claude-account-migrate
    persist:
      enabled: true
      namespace: skills.lov-claude-account-migrate
      records_path: skills.lov-claude-account-migrate.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要用户身份，请提供名称。
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要品牌身份，请提供品牌名称。
      - path: brand.site
        required: false
        question: 如果需要品牌官网，请提供地址。
      - path: brand.tone
        required: false
        question: 如果已有品牌语气或审美关键词，请提供它们。
      - path: records.retention_days
        required: false
        question: 迁移后的 Cowork 会话要保留多少天对话记录？（默认 3650）
      - path: records.include_orphans
        required: false
        question: 已丢失对话记录、只剩标题的会话是否也要一起复制？
  preferences:
    namespace: lov_claude_account_migrate
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
  interaction:
    ask_missing: true
    max_questions: 1
