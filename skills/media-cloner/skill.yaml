schema: skill-manifest/v1
id: lov-media-cloner
version: "0.1.0"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-media-cloner
    persist:
      enabled: true
      namespace: skills.lov-media-cloner
      records_path: skills.lov-media-cloner.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要用户身份，请提供名称。
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要品牌身份，请提供品牌名称。
      - path: brand.site
        required: false
        question: 如果需要品牌官网，请提供地址。
      - path: brand.tone
        required: false
        question: 如果已有品牌语气或审美关键词，请提供它们。
      - path: skills.lov-media-cloner.records.projects_root
        required: false
        question: 复刻工作区建在哪个目录？
      - path: skills.lov-media-cloner.records.logged_in_browser
        required: false
        question: 读取需要登录的平台（如小红书）时用哪个浏览器？
      - path: skills.lov-media-cloner.records.asr
        required: false
        question: 转写用本地 Whisper，还是导入已有转写？
  preferences:
    namespace: lov_media_cloner
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
  interaction:
    ask_missing: true
    max_questions: 1
