schema: skill-manifest/v1
id: lov-motivational-media-creator
version: 0.2.1
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
    - user
    - brand
    - workspace
    - preferences
    - skills.lov-motivational-media-creator
    persist:
      enabled: true
      namespace: skills.lov-motivational-media-creator
      records_path: skills.lov-motivational-media-creator.records
      write_policy: direct-user-statement
      atomic: true
    fields:
    - path: user.name
      aliases:
      - identity.name
      required: false
      question: 如果本次输出需要用户身份，请提供名称。
    - path: user.language
      required: false
      question: 希望使用哪种语言输出？
    - path: user.timezone
      required: false
      question: 需要使用哪个时区处理日期和时间？
    - path: brand.name
      aliases:
      - identity.name
      required: false
      question: 如果本次输出需要品牌身份，请提供品牌名称。
    - path: brand.site
      required: false
      question: 如果需要品牌官网，请提供地址。
    - path: brand.tone
      required: false
      question: 如果已有品牌语气或审美关键词，请提供它们。
    - path: skills.lov-motivational-media-creator.records.brand_name
      required: false
      question: 如果需要品牌专用绑定，请提供品牌名称。
    - path: skills.lov-motivational-media-creator.records.purpose
      required: false
      question: 需要本Skill长期服务哪类视频？
    - path: skills.lov-motivational-media-creator.records.reference_channel
      required: false
      question: 是否有明确参考频道？
    - path: brand.logo
      required: false
      question: 如需片尾归属，请提供批准的Logo。
    - path: skills.lov-motivational-media-creator.profile.brand_brief
      required: false
      question: 是否有批准的品牌brief？
  preferences:
    namespace: lov_motivational_media_creator
    fields:
    - path: user.language
      required: false
      question: 希望使用哪种语言输出？
    - path: user.timezone
      required: false
      question: 需要使用哪个时区处理日期和时间？
  interaction:
    ask_missing: true
    max_questions: 1
