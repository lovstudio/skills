schema: lovstudio/skill-card/v1
version: 0.2.0
display_name: YOLO 模式
display_name_en: YOLO Mode
description: 启动时核实当前 session 并通过宿主允许的接口准备任务必要权限，随后按预设和偏好自主执行。
owner:
  team: 本地 Skill 维护者
  contact: 通过本地源码变更记录联系维护者；未建立公开支持渠道。
license:
  name: MIT
  terms: 按随包 MIT LICENSE 使用；不包含第三方模型与服务额度。
  url: LICENSE
use_case:
  audience: 离开电脑但希望已有任务继续推进的 Agent 用户
  scenario: 吃饭、休息或睡觉前对当前任务显式启用无人值守。
  tasks:
  - 当前 session 权限检查、允许的配置与回读
  - 默认值与偏好解析
  - 权限受阻分支延期
  - 验证与恢复记录
deployment:
  geography: global
  environments:
  - 支持 Agent Skills 的本地宿主；运行能力服从宿主限制
requirements:
  credentials: 核心规则无需凭据；业务操作使用用户已经授权的连接。
  dependencies:
  - lov-branding-consistency
  runtime:
  - 支持 Skill 指令的 Agent
  - Python 3.8+ 用于 Profile
  - PyYAML 用于校验
risks:
- risk: 将无人值守误读为无限授权。
  mitigation: 操作前检查授权证据；受保护动作延期，不绕过审批。
- risk: 宿主弹窗、退出或休眠会中断任务。
  mitigation: 预检与检查点降低损失，明确不保证后台存活。
- risk: 错误猜测关键事实或重复外部写入。
  mitigation: 关键缺失项延期；结果未知先回读。
references:
- title: 执行合同
  path: SKILL.md
- title: 真实输入
  path: cases/request.md
- title: 演练与局限
  path: cases/behavior-review.md
- title: 当前 session 权限准备
  path: references/session-permissions.md
output:
  types:
  - 原任务产物
  - 任务状态与恢复记录
  formats:
  - 原业务格式
  - Markdown
  parameters:
  - 当前目标
  - 项目约定
  - 显式预设
  - 用户偏好
  - 授权证据
  validation:
  - 按原任务验收
  - 本包结构校验
  - 人工行为演练
  description: 交付真实完成部分、验证证据与延期条件，不把部分完成称为全部完成。
ethical_considerations: 不替用户同意、不泄露凭据、不扩大外部目标；尊重撤销、宿主权限和已有未提交改动。
dimensions:
- id: autonomy
  label: 非交互决策
  description: 默认使用预设、偏好及可逆推断。
  evidence: skill.yaml；cases/behavior-review.md 的命名与 Profile 场景。
  score: null
- id: authorization
  label: 授权边界
  description: 已授权直接执行，受保护操作不绕过。
  evidence: references/noninteractive.md；cases/behavior-review.md 的许可与拒绝场景。
  score: null
- id: continuity
  label: 恢复与真实性
  description: 继续独立分支，保留未知结果与恢复条件。
  evidence: references/run-record.md；cases/behavior-review.md 的延期、取消与超时场景。
  score: null
- id: session_readiness
  label: Session 权限准备
  description: 区分已具备、已配置与无可用设置能力，不虚构切换。
  evidence: references/session-permissions.md；cases/session-permissions.md。
  score: null
pricing:
  model: free
  currency: CNY
  list_price_cny: 0
  basis: 指令型本地工具，无自营云端执行服务；免费提供规则和配置。
  boundary: 包括规则、Profile 与本地校验；模型、宿主、第三方调用成本由用户现有服务承担。
  review_trigger: 引入托管运行服务或独立维护成本时重新评估；不自动收费。
  confidence: internal
distribution:
  paid: []
  free:
  - local
  channels:
    local: installed
    github: not_published
    lovstudio: not_published
    workbuddy: not_published
    skillpay: not_published
