schema: lovstudio/pricing-card/v1
version: "0.1.0"
model: free
currency: CNY
list_price_cny: 0
value_anchor: >
  一次“结论到手机卡片”的重排，加上一份可复核的移动可读性报告。替代的是手工在画图工具里反复
  调整字号、行宽与安全区的时间，以及因为字号过小、数字缺单位而返工的沟通成本。
basis: >
  免费。这个能力属于创作者日常重复劳动的基础设施，且完全在本地运行，不需要云端算力、账号或
  Credits；定价卡记录的是价值锚点与边界，而不是收入模型。
boundary: >
  包含：单卡与系列排版、精确像素渲染、移动可读性审计、品牌页脚与来源标注。
  不包含：内容写作、事实核查、生图或插图、翻译、发布到任何平台、云端存储与协作。
review_trigger: >
  出现以下任一情况时重新评估：需要云端渲染或生图而带来真实成本；模板体系扩展到需要维护的
  行业版式包；审计阈值与平台导出规格发生需要持续跟进的变更。
confidence: internal
