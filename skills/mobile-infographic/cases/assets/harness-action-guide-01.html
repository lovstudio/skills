<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>优化 harness 的三步</title>
  <style>
    :root {
      --canvas-width: 1080px;
      --canvas-height: 1440px;
      --safe-x: 88px;
      --safe-top: 96px;
      --safe-bottom: 96px;
      --block-gap: 40px;
      --primary: #182033;
      --accent: #EB6637;
      --accent-ink: #B0491A;
      --ink: #172033;
      --muted: #4A5468;
      --paper: #F7F4EF;
      --font: PingFang SC, Hiragino Sans GB, Microsoft YaHei, Inter, sans-serif;
      --soft-line: color-mix(in srgb, var(--ink) 12%, transparent);
      --tint: color-mix(in srgb, var(--primary) 8%, var(--paper));
      --tint-soft: color-mix(in srgb, var(--muted) 6%, var(--paper));
      --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--paper));
    }
/* Mobile Infographic shared layout.
   Font floors, line-length limits, safe areas, and ratio rules are defined in
   references/mobile-reading-standard.md. Keep this file brand-agnostic: the
   template sets the :root variables. */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #d8d8d6;
}

.card {
  position: relative;
  width: var(--canvas-width);
  height: var(--canvas-height);
  padding: var(--safe-top) var(--safe-x) var(--safe-bottom);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--block-gap);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: antialiased;
}

.card[data-ratio="long"] {
  height: auto;
  min-height: calc(var(--canvas-width) * 1.2);
}

/* ---------- head ---------- */

.card-head {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.eyebrow {
  margin: 0;
  font-size: 32px;
  line-height: 1.3;
  letter-spacing: 0.08em;
  color: var(--accent-ink);
  font-weight: 600;
}

.card-title {
  margin: 0;
  font-size: 72px;
  line-height: 1.32;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.claim {
  margin: 0;
  font-size: 52px;
  line-height: 1.34;
  font-weight: 600;
  color: var(--primary);
}

.rule {
  width: 100%;
  height: 3px;
  background: var(--ink);
  opacity: 0.85;
}

/* ---------- body ---------- */

.card-body {
  display: flex;
  flex-direction: column;
  gap: 40px;
  min-height: 0;
}

.block {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.block-label {
  margin: 0;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.body-text {
  margin: 0;
  font-size: 40px;
  line-height: 1.5;
  font-weight: 450;
}

.body-text strong {
  font-weight: 700;
  color: var(--primary);
}

.note {
  margin: 0;
  font-size: 30px;
  line-height: 1.45;
  color: var(--muted);
}

.source {
  margin: 0;
  font-size: 28px;
  line-height: 1.4;
  color: var(--muted);
}

/* ---------- components ---------- */

.steps {
  display: flex;
  flex-direction: column;
  gap: 30px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.step {
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr);
  gap: 26px;
  align-items: start;
  padding-bottom: 30px;
  border-bottom: 1px solid var(--soft-line);
}

.step:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.step-index {
  width: 84px;
  height: 84px;
  border-radius: 24px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: 40px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

.step-title {
  margin: 0 0 10px;
  font-size: 44px;
  font-weight: 650;
  line-height: 1.3;
}

.metric {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 36px 0;
  border-top: 3px solid var(--ink);
  border-bottom: 3px solid var(--ink);
}

.metric-value {
  font-size: 132px;
  line-height: 1.4;
  font-weight: 700;
  color: var(--accent-ink);
  letter-spacing: -0.02em;
}

.metric-unit {
  font-size: 36px;
  font-weight: 600;
  color: var(--muted);
}

.compare {
  display: flex;
  flex-direction: column;
  gap: 26px;
}

.compare-side {
  padding: 32px 34px;
  border-radius: 28px;
  background: var(--tint);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.compare-side[data-side="against"] {
  background: var(--tint-soft);
  border: 2px dashed var(--soft-line);
}

.compare-tag {
  font-size: 30px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.checklist {
  display: flex;
  flex-direction: column;
  gap: 26px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.check {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 22px;
  align-items: start;
}

.check-mark {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 32px;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent-ink);
}

.check[data-state="avoid"] .check-mark {
  background: transparent;
  border: 3px solid var(--muted);
  color: var(--muted);
}

.quote {
  margin: 0;
  padding-left: 40px;
  border-left: 8px solid var(--accent);
  font-size: 50px;
  line-height: 1.4;
  font-weight: 550;
}

.quote-attribution {
  margin: 0;
  font-size: 30px;
  color: var(--muted);
}

/* ---------- foot ---------- */

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding-top: 28px;
  border-top: 2px solid var(--soft-line);
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: 18px;
  min-width: 0;
}

.brand-logo {
  height: 46px;
  width: auto;
  display: block;
}

.attribution {
  font-size: 28px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.attribution a {
  color: inherit;
  text-decoration: none;
}

.page-mark {
  font-size: 28px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}
  </style>
</head>

  <article class="card" data-card data-template="single-claim" data-ratio="3:4" data-series-index="1" data-series-size="3">
    <header class="card-head">
      <p class="eyebrow" data-role="label">运营手册 · 01</p>
      <h1 class="card-title" data-role="title" data-claim>优化 harness 的三步</h1>
      <div class="rule"></div>
    </header>
    <div class="card-body">
      <div class="block">
        <p class="claim" data-role="claim" data-source-ref="S1">模型是自变量，harness 是因变量</p>
      </div>
      <div class="block">
        <p class="block-label" data-role="label">为什么</p>
        <p class="body-text" data-role="body" data-source-ref="S1">先声明用哪个模型，再谈工具、记忆与 Skill；换了模型，之前的一切结论都要重测。</p>
      </div>
      <div class="block">
        <p class="note" data-role="note" data-source-ref="S1">口径：只有同一任务集、同一模型版本的两轮结果才可比。</p>
      </div>
      <p class="source" data-role="source" data-source-ref="S1">来源：视频《如何构建个人 harness？从 vibe 动画到 auto 动画》+ 本机 Skill 盘点</p>
