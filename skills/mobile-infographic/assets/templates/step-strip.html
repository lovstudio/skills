<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --canvas-width: {{CANVAS_WIDTH}}px;
      --canvas-height: {{CANVAS_HEIGHT}}px;
      --safe-x: {{SAFE_X}}px;
      --safe-top: {{SAFE_TOP}}px;
      --safe-bottom: {{SAFE_BOTTOM}}px;
      --block-gap: {{BLOCK_GAP}}px;
      --primary: {{BRAND_PRIMARY}};
      --accent: {{BRAND_ACCENT}};
      --accent-ink: {{BRAND_ACCENT_INK}};
      --ink: {{BRAND_INK}};
      --muted: {{BRAND_MUTED}};
      --paper: {{BRAND_PAPER}};
      --font: {{FONT_FAMILY}};
      --soft-line: color-mix(in srgb, var(--ink) 12%, transparent);
      --tint: color-mix(in srgb, var(--primary) 8%, var(--paper));
      --tint-soft: color-mix(in srgb, var(--muted) 6%, var(--paper));
      --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--paper));
    }
{{BASE_CSS}}
  </style>
</head>
<body>
  <article class="card" data-card data-template="{{TEMPLATE_ID}}" data-ratio="{{RATIO}}" data-series-index="{{SERIES_INDEX}}" data-series-size="{{SERIES_SIZE}}">
    <header class="card-head">
      <p class="eyebrow" data-role="label" data-skeleton="1">{{EYEBROW}}</p>
      <h1 class="card-title" data-role="title" data-claim>{{TITLE}}</h1>
      <div class="rule"></div>
    </header>
    <div class="card-body">
      <ol class="steps">
        <li class="step">
          <span class="step-index" data-encoding="order" data-source-ref="{{SOURCE_ID}}" data-skeleton="1">1</span>
          <div class="step-content">
            <p class="step-title" data-role="body" data-source-ref="{{SOURCE_ID}}" data-skeleton="1">第一步的动作名称</p>
            <p class="body-text" data-role="body" data-source-ref="{{SOURCE_ID}}" data-skeleton="1">写完这一步要做什么、做到什么程度算完成。</p>
          </div>
        </li>
        <li class="step">
          <span class="step-index" data-encoding="order" data-source-ref="{{SOURCE_ID}}" data-skeleton="1">2</span>
          <div class="step-content">
            <p class="step-title" data-role="body" data-source-ref="{{SOURCE_ID}}" data-skeleton="1">第二步的动作名称</p>
            <p class="body-text" data-role="body" data-source-ref="{{SOURCE_ID}}" data-skeleton="1">这一步的输入来自上一步的什么产物，产出什么。</p>
          </div>
        </li>
        <li class="step">
          <span class="step-index" data-encoding="order" data-source-ref="{{SOURCE_ID}}" data-skeleton="1">3</span>
          <div class="step-content">
            <p class="step-title" data-role="body" data-source-ref="{{SOURCE_ID}}" data-skeleton="1">第三步的动作名称</p>
            <p class="body-text" data-role="body" data-source-ref="{{SOURCE_ID}}" data-skeleton="1">收口动作，或这一步之后如何判断可以进入下一步。</p>
          </div>
        </li>
      </ol>
      <p class="source" data-role="source" data-source-ref="{{SOURCE_ID}}" data-skeleton="1">{{SOURCE}}</p>
    </div>
    <footer class="card-foot">
      <span class="brand-lockup">
        <img class="brand-logo" data-brand-logo src="{{BRAND_LOGO}}" alt="{{BRAND_NAME}}">
        <span class="attribution" data-attribution>{{ATTRIBUTION}} · <a href="{{BRAND_SITE}}">{{BRAND_SITE_LABEL}}</a></span>
      </span>
      <span class="page-mark" data-page>{{PAGE_MARK}}</span>
    </footer>
  </article>
</body>
</html>
