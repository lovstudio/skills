  local:
    status: installed
    evidence: "2026-10-22：~/.claude/skills/lov-logo-sting -> ../../.agents/skills/lov-logo-sting -> 本地源码目录 logo-sting-skill，readlink -f 解析到源码。"
  paid:
    - channel: workbuddy
      status: not-published
    - channel: skillpay
      status: not-published
  free:
    - channel: github
      status: private-source
      evidence: "2026-11-17：源码独立为私有仓库 lovstudio/logo-sting-skill；免费 Skill 的公开副本由 lovstudio/skills 目录镜像提供。"
    - channel: lovstudio
      status: pending
      evidence: "2026-11-17：目录条目与镜像已提交待合并；详情页、版本显示与安装命令尚未回读。"
