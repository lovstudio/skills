schema: lovstudio/skill-card/v1
version: "0.3.1"
description: "口播短片：输入一个主题，产出 AI 工具类竖版口播的带出处事实、过门禁的脚本、提词器、上屏证据与封面；作者竖拍一条口播后，自动挑出每句最后念对的一遍、剪掉停顿，排成上半屏证据、下半屏作者的竖版成片，并交配乐、封面与质检报告。"
owner:
  team: "Lovstudio.AI"
  contact: "https://lovstudio.ai"
license:
  name: MIT
  terms: "MIT。生成物的著作权归作者；片中第三方网页截图须注明来源并遵守其使用条款。"
  url: "../LICENSE"
use_case:
  audience: "做 AI 工具、效率、开发类口播短视频的个人创作者与小团队"
  scenario: "有选题、愿意自己出镜，但写稿、找证据、做提词、剪辑、做封面太耗时"
  tasks:
    - "把主题写成按片型门禁检查过的口播脚本"
    - "生成提词器、分镜与素材清单，截取网页与命令输出证据"
    - "把一条含重读的口播原片对齐、剪成竖版成片"
    - "生成 3:4 与 16:9 封面并做缩略图可读性检查"
deployment:
  geography: global
  environments:
    - "macOS（Apple Silicon）本机：Whisper 对齐与 Vision 抠图"
    - "其他系统：可用外部 ASR 的逐字时间戳与自备抠图，其余环节照常"
requirements:
  credentials: "可选：VOICENGINE_API_KEY（样片占位配音）、OPENROUTER_API_KEY（AI 配乐）；只从环境变量读取"
  dependencies:
    - "lov-branding-consistency"
  runtime:
    - "Python 3.9+（numpy、pillow、mlx-whisper、opencc-python-reimplemented、jieba）"
    - "Playwright、FFmpeg/FFprobe"
    - "Node 20+、pnpm、Remotion 4.0.517"
    - "macOS swiftc + Vision"
risks:
  - risk: "被用来冒充他人：用别人的脸、声音或账号名出片"
    mitigation: "硬门禁 0：出镜、声音、名字、Logo 只用作者本人；脚本门禁禁用参考博主口头禅；拒绝数字人冒充"
  - risk: "口播里出现不实数字或过期信息"
    mitigation: "含数字的句子必须引用带出处与核对日期的事实；时效信息先查一手来源"
  - risk: "剪辑吃字或保留了念错的那一遍"
    mitigation: "最长静音缝落刀；成片重转写算吃字率 ≤ 3%；低分句列入人工复核"
  - risk: "把 TTS 样片当成片发布"
    mitigation: "样片画面带「配音与出镜为占位」角标，状态单列为 animatic，发布只交给批准后的成片"
references:
  - title: "Primary Skill instructions"
    path: "SKILL.md"
  - title: "风格语法"
    path: "references/style-grammar.md"
  - title: "脚本字段"
    path: "references/script-format.md"
  - title: "流水线"
    path: "references/pipeline.md"
output:
  types:
    - "口播脚本与事实表"
    - "提词器与素材清单"
    - "竖版成片与封面"
    - "质检报告"
  formats:
    - "JSON、Markdown、HTML"
    - "MP4（1080×1920，30 fps，H.264 + AAC，bt709）"
    - "PNG（1080×1440、1920×1080）"
  parameters:
    - "片型 list / tips / review / tier / case"
    - "语速估计（默认 5.8 字/秒）"
    - "人像脸部高度 face-y、配乐响度、命名与版本"
  validation:
    - "check_script.py 0 ERROR"
    - "align.py review 为空或已确认"
    - "finish.py：尺寸、帧率、帧数、bt709、码率、响度、真峰、吃字率全部通过"
    - "联系表与封面缩略图人工目视"
  description: "每一集一个目录：work/ 放脚本与工程，deliverables/ 放提词器与各版本成片，qc/ 放门禁报告、联系表与缩略图。"
ethical_considerations: "只复刻片型，不复刻人；不下载、搬运他人作品做素材；截图注明来源；AI 生成的配音、配乐、卡片在交付说明里列明；样片与成片状态分开。"
dimensions:
  - id: correctness
    label: "切点与文字正确"
    description: "每句选对最后一遍、句首句尾不吃字，字幕文字与脚本一致"
    evidence: "2026-10-28 样片：含 2 处故意念错重读的合成录音，12 句切点全部落在真值前 60–70 ms / 后 80–90 ms；成片重转写吃字率 0%、CER 0.027"
    score: null
  - id: effectiveness
    label: "片型还原度"
    description: "结构、语速、换画面节奏、字幕与封面语法是否符合量出来的片型"
    evidence: "风格语法来自 7 条代表作转写、1.5 秒接触表与 30 张封面；样片约 1–3 秒换一次证据，三种布局按句切换（qc 联系表）"
    score: null
  - id: efficiency
    label: "作者投入"
    description: "作者只需录一条口播，其余由 Agent 完成"
    evidence: "样片从脚本到 v0.2 成片与两张封面全部由脚本链路生成；作者侧只剩照提词器录制一项"
    score: null
pricing:
  model: free
  currency: CNY
  list_price_cny: 0
  basis: "作者于 2026-10-30 决定以 MIT 协议开源，停止付费销售；0.2.x 曾在 Lovstudio.AI 官网以一次性 1,394 Credits 发布"
  boundary: "含片型语法、脚本门禁、提词器、证据截图、录音对齐、竖版起步工程、封面与质检脚本；不含第三方服务费用、字体商用授权与人工代剪"
  review_trigger: "不再按付费能力复评；版本大改或维护成本明显变化时复查"
  confidence: low
distribution:
  # 2026-10-30 起以 MIT 协议开源，源码仓库公开
  paid: []
  free:
    - channel: github
      status: public
