schema: skill-manifest/v1
id: lov-clean-mac
version: 0.4.0
runtime: skill-runtime/v1
context:
  profile:
    fields: []
  preferences:
    namespace: macos_disk_optimizer
    fields:
      - path: target_free_gb
        required: false
        question: "磁盘优化是否有默认的最低可用空间目标？"
      - path: buffer_gb
        required: false
        question: "目标空间之外是否需要固定安全余量？"
      - path: cleanup_policy
        required: false
        question: "默认采用保守、均衡还是积极的清理策略？"
  interaction:
    ask_missing: true
    max_questions: 1
