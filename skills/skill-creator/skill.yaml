schema: skill-manifest/v1
id: lov-skill-creator
version: 4.3.0
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
    - user
    - brand
    - workspace
    - preferences
    - skills.lov-skill-creator
    persist:
      enabled: true
      namespace: skills.lov-skill-creator
      records_path: skills.lov-skill-creator.records
      write_policy: direct-user-statement
      atomic: true
    fields:
    - path: user.name
      aliases:
      - identity.name
      required: false
      question: 如果本次输出需要用户身份，请提供名称。
    - path: brand.name
      aliases:
      - identity.name
      required: false
      question: 如果本次输出需要品牌身份，请提供品牌名称。
    - path: brand.logo
      aliases:
      - identity.logo
      required: false
      question: 如果需要使用品牌 Logo，请提供 Logo 地址或文件路径。
    - path: brand.tone
      required: false
      question: 如果已有品牌语气或审美关键词，请提供它们。
  preferences:
    namespace: lov_skill_creator
    fields:
    - path: user.language
      required: false
      question: 希望使用哪种语言输出？
    - path: user.timezone
      required: false
      question: 需要使用哪个时区处理日期和时间？
  interaction:
    ask_missing: true
    max_questions: 1
