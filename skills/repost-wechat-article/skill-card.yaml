schema: lovstudio/skill-card/v1
version: "0.1.0"
description: "把外部微信公众号文章转换成来源可核验、原文冻结、发布方增量清楚且不误报原创或发布状态的转载草稿。"
owner:
  team: "LovStudio"
  contact: "https://lovstudio.ai"
license:
  name: MIT
  terms: "Skill 源码采用 MIT；来源文章、图片、Logo 和发布权限由调用者与相应权利人负责。"
  url: "LICENSE"
use_case:
  audience: "公众号作者、品牌团队、合作运营人员和维护内容工作流的 Agent 开发者"
  scenario: "从公开 URL 或微信分享线索定位合作方文章，保持原文主体并加入发布方可证实的开场、判断和品牌收尾。"
  tasks:
    - "定位真实来源并建立正文、图片和授权账本"
    - "冻结原文并隔离内部合作语境"
    - "加入发布方增量与官方品牌资产"
    - "交给公众号发布链并回读草稿保真状态"
deployment:
  geography: global
  environments:
    - "支持 Portable Agent Skills 的本地 Agent Harness"
    - "可读取工作区文件并运行 Python 的桌面或 CLI 环境"
requirements:
  credentials: "本地制作与审计无需凭据；微信草稿凭据由下游 lov-env-management 解析。"
  dependencies:
    - "lov-branding-consistency"
    - "lov-publish-wechat-article"
    - "beautifulsoup4"
  runtime:
    - "Python 3.9+"
    - "公开微信文章 URL，或可由可选 lov-wdb-cli 缩窄的分享线索"
risks:
  - risk: "品牌化或润色过程可能改写合作方原文。"
    mitigation: "原文进入唯一冻结区，以归一化可见文字 SHA-256 和图片账本在本地与远端双重核验。"
  - risk: "内部聊天中的未官宣嘉宾、议题、价格或联系人可能泄露。"
    mitigation: "建立 sourceTruth、publishableContext、privateContext 和 evidenceGap 四栏账本，只有前两栏进入成品。"
  - risk: "转载可能被错误声明为原创，或合作关系被写成版权转让。"
    mitigation: "copyrightMode 固定为 reprint；原创字段禁止请求，来源账号和完整 URL 原位展示。"
  - risk: "草稿回读失败后重复创建，造成多个同名草稿。"
    mitigation: "draft/add 后立即持久化 mediaId 和远端正文；审计失败时先诊断同一草稿，不再次新建。"
  - risk: "本地预览或 draft/add 成功被误报为公开发布。"
    mitigation: "严格区分 prepared、draft_created 与 published；只有平台回读公开标识才报告 published。"
references:
  - title: "Primary Skill instructions"
    path: "SKILL.md"
  - title: "Source fidelity"
    path: "references/source-fidelity.md"
  - title: "Editorial overlay"
    path: "references/editorial-overlay.md"
  - title: "Publication handoff"
    path: "references/publication-handoff.md"
  - title: "Verified S创 case"
    path: "cases/schuang-2026-evidence.json"
output:
  types:
    - "WeChat repost package"
    - "source-fidelity audit receipt"
    - "verified WeChat draft receipt"
  formats:
    - "Markdown"
    - "HTML"
    - "JSON"
    - "JPEG and PNG"
  parameters:
    - "action: prepared | create_draft | publish"
    - "copyrightMode: reprint"
    - "source account and source URL"
  validation:
    - "source visible text SHA-256 matches the frozen source block"
    - "source image ledger and required block counts match"
    - "remote draft receipt records remoteFidelityVerified true"
  description: "一个可回读的转载目录，来源快照、冻结原文、发布方增量、品牌资产和远端状态能独立验收。"
ethical_considerations: "尊重来源作者、转载许可、私人沟通和官方品牌资产；不伪造亲历、背书、版权、原创声明或公开发布状态。"
dimensions:
  - id: provenance
    label: "来源可追溯"
    description: "公开 URL、来源账号、原文文字与图片都有稳定账本。"
    evidence: "首个案例记录 S创Slush 原文 URL、归一化正文 SHA-256 与 14 张来源图片。"
    score: null
  - id: source_fidelity
    label: "原文保真"
    description: "冻结区内的可见文字与原文一致，平台净化只影响允许的包装。"
    evidence: "首个案例远端来源块与本地 source-text 一致；微信仅移除一个外部链接包装与一个 position 属性。"
    score: null
  - id: editorial_separation
    label: "增量与原文分离"
    description: "开场、来源说明、收尾和品牌尾注位于冻结区外且各出现一次。"
    evidence: "首个案例回读五个新增品牌区块，每个区块唯一，合作方正文未插入发布方评论。"
    score: null
  - id: privacy_and_rights
    label: "隐私与权利诚实"
    description: "内部合作语境不泄露，转载不声明原创。"
    evidence: "首个案例未公开聊天中的初步圆桌细节，copyrightMode 为 reprint，状态明确未正式发布。"
    score: null
  - id: remote_truth
    label: "远端状态可信"
    description: "本地生成、草稿创建与公开发布分层报告。"
    evidence: "首个案例回读标题、作者、摘要、封面和 15 张远端图片，最终仅报告 draft_created。"
    score: null
pricing:
  model: free
  currency: CNY
  list_price_cny: 0
  basis: "0.1.0 作为来源保真与公众号组合工作流的本地基础设施开放验证。"
  boundary: "免费范围覆盖 Skill 源码、转载契约、保真脚本和本地组合说明；模型调用、素材授权、公众号账号、代运营与正式发布服务不包含。"
  review_trigger: "若加入托管网页抓取、多账号审批、版权许可管理、云端素材库或代发布服务，重新评估价格与访问方式。"
  confidence: internal
distribution:
  paid: []
  free: []
  states:
    local: available
    github: not_published
    lovstudio: not_published
    workbuddy: not_prepared
    skillpay: not_prepared

