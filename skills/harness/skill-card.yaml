schema: lovstudio/skill-card/v1
version: "0.1.0"
description: >-
  一次扫描看清本机 Agent harness 的三块内容：根 Prompt 怎样分发到各宿主、各宿主装了哪些 Skill、
  自己维护的 Skill 源码处于什么状态；并提供先预览、后执行、可撤销的整理。结果以本地驾驶舱、
  终端摘要或单文件快照呈现。
owner:
  team: "Lovstudio.AI Skill maintainers"
  contact: "local source maintainers"
license:
  name: MIT
  terms: "按仓库内 LICENSE 使用、修改与再分发。"
  url: "LICENSE"
use_case:
  audience: "在一台机器上同时使用多个 Agent 宿主、并自己维护一批 Skill 的个人或小团队"
  scenario: "规则文件、Skill 安装目录和 Skill 源码散落在几十个位置，需要一眼看出哪里断了、重了、过期了，再安全地整理。"
  tasks:
    - "查看根 Prompt 的规则结构、reference 路由与各宿主的绑定状态。"
    - "检查各宿主已安装的 Skill：断链、重名、绕经其他宿主的链接、描述占用。"
    - "对照 Skill 源码的版本号、Git 状态、目录登记与镜像。"
    - "预览并执行可撤销的整理：移除断链、规范链接、停用与启用、安装到宿主。"
deployment:
  geography: global
  environments:
    - "Claude Code、Codex 等支持 Skill 与本地 shell 的宿主"
    - "macOS 本机（已验证）；Linux 预期可用但尚未实测；驾驶舱只监听回环地址"
requirements:
  credentials: "none"
  dependencies: []
  runtime:
    - "Python 3.9 或更新版本（仅标准库）"
    - "git（可选，用于源码仓库状态）"
    - "PyYAML（可选，用于目录对照与严格的 frontmatter 校验）"
    - "浏览器（仅驾驶舱需要）"
risks:
  - risk: "整理动作改动了用户并不想动的链接或条目。"
    mitigation: "默认只读；整理先出逐步计划并需要明确确认；只增删符号链接或移动条目，不删除实体文件；每个批次可撤销。"
  - risk: "本地服务被本机其他网页或进程调用。"
    mitigation: "只绑定回环地址并校验 Host；所有接口需要页面内的一次性令牌，写接口另需启动时显式开启；可读文件限定为本次扫描到的指令文件与 SKILL.md。"
  - risk: "第三方 Skill 的名称或描述里夹带脚本，在界面里被执行。"
    mitigation: "界面只用纯文本写入动态内容，并用内容安全策略禁止内联脚本与样式。"
  - risk: "快照、导出文件或截图带出本机的规则正文与目录结构。"
    mitigation: "路径一律以波浪号开头的家目录写法显示，远端地址只保留 owner/repo；导出文件的位置与是否外发由用户决定。"
  - risk: "把依赖本地检出新旧的判断当成事实，例如落后上游、目录与镜像版本。"
    mitigation: "相关问题的说明写明以上次 fetch 或本地目录仓库为准，工作流要求随结论一并说明。"
references:
  - title: "Primary Skill instructions"
    path: "SKILL.md"
  - title: "检查项与整理动作"
    path: "references/checks.md"
  - title: "Composition analysis"
    path: "references/skill-composition.md"
  - title: "扫描、驾驶舱服务与整理引擎"
    path: "scripts/harness.py"
output:
  types:
    - "本地驾驶舱（网页）"
    - "Markdown 摘要"
    - "快照 JSON"
    - "单文件只读 HTML"
    - "整理记录 JSON"
  formats:
    - "HTML"
    - "Markdown"
    - "JSON"
  parameters:
    - "共享配置目录、Skill 源码根目录、目录文件、整理记录目录"
    - "报告的区域、级别与条数"
    - "整理项：问题 ID、问题代码、停用或启用的入口、安装或移除的宿主"
  validation:
    - "selftest 在临时目录上核对各类问题的识别、整理结果、撤销后的还原与驾驶舱接口"
    - "整理的每一步在执行前重新核对前提"
    - "validate_skill.py 校验源码结构"
  description: "按 System Prompt、Skills、工作室三个区域给出现状、带稳定 ID 的问题清单和其中可自动整理的部分；整理输出逐步计划、执行结果与可撤销的批次记录。"
ethical_considerations: >-
  只读取用户自己机器上的 Agent 配置，不联网、不上传。规则正文与 Skill 列表属于用户的私人工作环境，
  导出或截图前应由用户决定是否外发。整理只在用户明确同意后执行，且不替用户提交、推送或发布任何内容。
dimensions:
  - id: coverage
    label: "覆盖面"
    description: "一次扫描同时覆盖规则链路、已装 Skill 与 Skill 源码三块内容。"
    evidence: "2026-11-10 在维护者本机：1 个根 Prompt、7 个 reference、13 个宿主指令文件、共享目录与 64 个宿主 Skill 目录共 2883 个入口、239 个源码目录与 236 条目录条目，扫描并出报告用时 2.66 秒。"
  - id: correctness
    label: "识别准确"
    description: "问题来自对文件系统、frontmatter 与 Git 的直接读取，同一问题的 ID 在两次扫描之间不变。"
    evidence: "selftest 在构造的临时家目录上逐一核对 30 类问题的识别；本机结果里抽查了 2 条失效路径引用、2 个过期的嵌入副本和 2 个断链，均与实际文件一致。"
  - id: reversibility
    label: "可撤销"
    description: "整理只增删符号链接或移动条目，逐批记录，可按相反顺序还原。"
    evidence: "selftest 连续执行三个批次后依次撤销，核对目录布局与执行前一致；删除实体目录和移动源码目录的步骤被引擎拒绝。"
  - id: boundary
    label: "边界与只读性"
    description: "默认只读，写操作需要显式开关与确认，不触碰源码仓库与 Git 历史。"
    evidence: "只读模式下执行接口返回 403；本机验收对 9 个断链只做了计划预览，唯一执行的写操作是把本 Skill 安装到两个宿主的 2 个链接，已记入整理记录。"
pricing:
  model: free
  currency: CNY
  list_price_cny: 0
  basis: "官网目录免费条目（0 Credits），本地使用同样免费。六维加权 2.7/5：证据只有一次维护者本机验收，同类检查有免费替代，先以免费入口积累使用证据。"
  boundary: "包含扫描、驾驶舱、报告、导出与整理引擎；不含对单个 Skill 的内容优化、发布与目录同步、规则正文的改写，也不含任何托管服务。"
  review_trigger: "累计 10 次外部完整使用、出现 3 台以上不同机器的结果、完成 Linux 实测，或加入改写规则文件、托管服务等新交付范围时，由 lov-skill-pricing 复评。"
  confidence: case-backed
distribution:
  paid: []
  free:
    - lovstudio
  channels:
    github: private source repository; the public copy is the lovstudio/skills mirror
    lovstudio: free catalog entry (0 Credits)
    workbuddy: not_requested
    skillpay: not_requested
