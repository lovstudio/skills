schema: lovstudio/pricing-card/v1
version: "0.3.1"
model: free
currency: CNY
list_price_cny: 0
value_anchor: >
  一份作者性与篇章结构契约，加上可复现的中文真人写作实测分布（351 篇 /
  约 169 万字，30 项指标的分位数表与双向定界规则），形成「追溯作者选择 →
  审篇章 → 定向改写 → 数值复测」的验收闭环。
  同类方案给的是模式清单或手工阈值，无法回答「这次改写是否真的生效、有没有
  把别的指标推坏」。
basis: >
  免费的理由不是价值低，而是核心资产是那份公开的分布与校准方法论——它越被
  复现、质疑、用自己的语料重跑，就越可靠；收费会直接阻碍这件事。成本侧也
  支持免费：纯 Python 标准库的本地脚本，无 API 调用、无服务端、无运维。
boundary: >
  含：作者性账本、七维篇章审计、证据约束改写、30 项指标度量、四档 profile（wechat / zhuque / neutral / thesis）、
  越界靶点定位到句、--compare 复测对照、--calibrate 个人基线（自带压力标尺）、
  完整基准文档与已知局限。
  不含：判别力（AI 稿召回率）保证——该维度尚无带标签语料验证；学术诚信或
  平台合规的举证用途；英文稿件（指标定义只对中文成立）；代替用户提供真实
  细节——缺具体数字与经历时会询问，不会编造。
review_trigger: >
  补齐带标签的 AI 生成中文散文语料、验证出可靠的召回率之后，重新评估是否
  作为付费能力发布。在那之前保持免费，因为付费产品不应把「判别力未验证」
  作为已知局限交付。
confidence: internal
