schema: skill-manifest/v1
id: lov-human-writing
version: "0.3.1"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-human-writing
    persist:
      enabled: true
      namespace: skills.lov-human-writing
      records_path: skills.lov-human-writing.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要用户身份，请提供名称。
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要品牌身份，请提供品牌名称。
      - path: brand.site
        required: false
        question: 如果需要品牌官网，请提供地址。
      - path: brand.tone
        required: false
        question: 如果已有品牌语气或审美关键词，请提供它们。
      - path: skills.lov-human-writing.records.default_profile
        required: false
        question: 默认使用哪个中文表层度量档位？
      - path: skills.lov-human-writing.records.baseline_path
        required: false
        question: 是否有经过清洗的个人写作基线文件？
  preferences:
    namespace: lov_human_writing
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: skills.lov-human-writing.records.default_profile
        required: false
        question: 默认使用哪个中文表层度量档位？
  interaction:
    ask_missing: true
    max_questions: 1
