schema: skill-manifest/v1
id: find-ebook
version: 0.1.1
runtime: skill-runtime/v1
context:
  profile:
    fields: []
  preferences:
    namespace: find_ebook
    fields:
      - path: user.language
        required: false
        question: "电子书检索结果默认使用哪种语言？"
      - path: formats
        required: false
        question: "是否有优先电子书格式？"
      - path: quality
        required: false
        question: "是否有默认的版本质量偏好？"
  interaction:
    ask_missing: true
    max_questions: 1
