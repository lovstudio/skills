<style data-template-style>
  .waterfall-layout {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 24px;
  }

  .waterfall-chart {
    min-height: 0;
    position: relative;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 18px;
    align-items: end;
    padding: 40px 24px 42px;
    border-bottom: 2px solid var(--ink);
  }

  .waterfall-baseline {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 42%;
    border-top: 1px dashed var(--muted);
  }

  .waterfall-bar {
    position: relative;
    min-height: 34px;
    display: grid;
    align-content: start;
    justify-items: center;
    padding-top: 8px;
    color: white;
    background: var(--brand-primary);
    font-size: 12px;
    font-weight: 720;
  }

  .waterfall-bar--positive { background: var(--brand-accent); }
  .waterfall-bar--negative { background: color-mix(in srgb, var(--brand-primary) 60%, white); }
  .waterfall-bar--total { background: var(--ink); }

  .waterfall-bar span {
    position: absolute;
    left: 50%;
    bottom: -34px;
    width: 130%;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 10px;
    line-height: 1.2;
    font-weight: 560;
    text-align: center;
  }

  .waterfall-link {
    position: absolute;
    right: -18px;
    top: 0;
    width: 18px;
    border-top: 1px dashed var(--muted);
  }

  .waterfall-readout {
    display: grid;
    align-content: center;
    gap: 16px;
    padding-left: 18px;
    border-left: 1px solid var(--line);
  }

  .waterfall-readout strong {
    display: block;
    color: var(--brand-accent);
    font-size: 30px;
    line-height: 1;
  }

  .waterfall-readout p {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
</style>

<template data-template-body>
  <section
    class="waterfall-layout"
    data-primary-block
    data-audit-container
    data-encoding="length color"
    aria-label="价值桥或瀑布图"
  >
    <div class="waterfall-chart">
      <div class="waterfall-baseline" data-baseline></div>
      <div class="waterfall-bar waterfall-bar--total" data-data-point data-source-ref="S1" style="height:66%">
        100
        <span>起点</span>
        <i class="waterfall-link" data-connector></i>
      </div>
      <div class="waterfall-bar waterfall-bar--positive" data-data-point data-source-ref="S2" style="height:28%;margin-bottom:38%">
        +20
        <span>驱动 A</span>
        <i class="waterfall-link" data-connector></i>
      </div>
      <div class="waterfall-bar waterfall-bar--negative" data-data-point data-source-ref="S3" style="height:18%;margin-bottom:30%">
        −12
        <span>阻力 B</span>
        <i class="waterfall-link" data-connector></i>
      </div>
      <div class="waterfall-bar waterfall-bar--positive" data-data-point data-source-ref="S4" style="height:22%;margin-bottom:30%">
        +16
        <span>驱动 C</span>
        <i class="waterfall-link" data-connector></i>
      </div>
      <div class="waterfall-bar waterfall-bar--negative" data-data-point data-source-ref="S5" style="height:14%;margin-bottom:38%">
        −8
        <span>阻力 D</span>
      </div>
      <div class="waterfall-bar waterfall-bar--total" data-data-point data-decision data-source-ref="S6" style="height:78%">
        116
        <span>终点</span>
      </div>
    </div>

    <aside class="waterfall-readout">
      <p data-unit>单位：请替换真实单位 / 时间范围</p>
      <p data-annotation data-audit="annotation">
        <strong>+16</strong>请替换：最大净驱动及其证据含义。
      </p>
      <p data-annotation data-audit="annotation">
        请替换：解释桥接关系、起止口径和不可相加项。
      </p>
    </aside>
  </section>
</template>
