<style data-template-style>
  .driver-tree {
    height: 100%;
    display: grid;
    grid-template-columns: 1.05fr 50px 1fr 50px 1.2fr;
    grid-template-rows: repeat(4, minmax(0, 1fr));
    align-items: stretch;
    gap: 9px 0;
  }

  .driver-node {
    display: grid;
    align-content: center;
    padding: 12px 15px;
    border-left: 5px solid var(--brand-accent);
    background: color-mix(in srgb, white 58%, var(--paper));
    font-size: 14px;
    line-height: 1.28;
    font-weight: 680;
  }

  .driver-node small {
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 500;
  }

  .driver-root {
    grid-row: 1 / 5;
    color: white;
    background: var(--brand-primary);
    border-left-color: var(--brand-primary);
    font-size: 21px;
  }

  .driver-mid { grid-row: span 2; }

  .driver-line {
    align-self: center;
    height: 1px;
    background: var(--ink);
    position: relative;
  }

  .driver-line::after {
    content: "";
    position: absolute;
    right: 0;
    top: -3px;
    width: 7px;
    height: 7px;
    border-top: 1px solid var(--ink);
    border-right: 1px solid var(--ink);
    transform: rotate(45deg);
  }

  .driver-annotation {
    position: absolute;
    right: 0;
    bottom: -1px;
    max-width: 420px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
    text-align: right;
  }
</style>

<template data-template-body>
  <section
    class="driver-tree"
    data-primary-block
    data-audit-container
    data-encoding="connection containment"
    aria-label="驱动因素树"
  >
    <div class="driver-node driver-root" data-driver data-level="1" data-decision data-source-ref="S1">
      核心结果<small data-annotation>请替换唯一结果变量与单位</small>
    </div>
    <div class="driver-line" data-connector style="grid-row:1/3;grid-column:2"></div>
    <div class="driver-line" data-connector style="grid-row:3/5;grid-column:2"></div>

    <div class="driver-node driver-mid" data-driver data-level="2" style="grid-row:1/3;grid-column:3">
      一级驱动 A<small>请替换可解释机制</small>
    </div>
    <div class="driver-node driver-mid" data-driver data-level="2" style="grid-row:3/5;grid-column:3">
      一级驱动 B<small>请替换可解释机制</small>
    </div>

    <div class="driver-line" data-connector style="grid-row:1;grid-column:4"></div>
    <div class="driver-line" data-connector style="grid-row:2;grid-column:4"></div>
    <div class="driver-line" data-connector style="grid-row:3;grid-column:4"></div>
    <div class="driver-line" data-connector style="grid-row:4;grid-column:4"></div>

    <div class="driver-node" data-driver data-level="3" data-source-ref="S2" style="grid-row:1;grid-column:5">
      二级驱动 A1<small>指标 / 证据</small>
    </div>
    <div class="driver-node" data-driver data-level="3" data-source-ref="S2" style="grid-row:2;grid-column:5">
      二级驱动 A2<small>指标 / 证据</small>
    </div>
    <div class="driver-node" data-driver data-level="3" data-source-ref="S3" style="grid-row:3;grid-column:5">
      二级驱动 B1<small>指标 / 证据</small>
    </div>
    <div class="driver-node" data-driver data-level="3" data-source-ref="S3" style="grid-row:4;grid-column:5">
      二级驱动 B2<small>指标 / 证据</small>
    </div>

    <p class="driver-annotation" data-annotation data-audit="annotation">
      请替换：每一层回答同一个分解问题，分支应尽量互斥且合计完整。
    </p>
  </section>
</template>
