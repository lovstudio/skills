<style data-template-style>
  .matrix-wrap {
    height: 100%;
    display: grid;
    grid-template-rows: 30px minmax(0, 1fr) 38px;
    gap: 8px;
  }

  .matrix-legend {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
  }

  .legend-scale {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .legend-swatch {
    display: inline-block;
    width: 13px;
    height: 13px;
    margin-right: 4px;
    vertical-align: -2px;
    background: var(--soft-line);
  }

  .legend-swatch--high { background: var(--brand-accent); }

  .matrix {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(210px, 1.35fr) repeat(3, minmax(150px, 1fr)) minmax(230px, 1.45fr);
    grid-template-rows: 44px repeat(3, minmax(0, 1fr));
    border-top: 2px solid var(--ink);
    border-bottom: 1px solid var(--ink);
  }

  .matrix > * {
    min-width: 0;
    padding: 11px 14px;
    border-right: 1px solid var(--soft-line);
    border-bottom: 1px solid var(--soft-line);
  }

  .matrix > *:nth-child(5n) { border-right: 0; }
  .matrix > *:nth-last-child(-n + 5) { border-bottom: 0; }

  .matrix-head {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.2;
    font-weight: 720;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .matrix-entity {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    font-size: 17px;
    line-height: 1.18;
    font-weight: 720;
  }

  .matrix-entity small {
    color: var(--muted);
    font-size: 11px;
    font-weight: 520;
  }

  .matrix-cell {
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }

  .matrix-cell strong {
    display: inline-grid;
    place-items: center;
    width: 30px;
    height: 30px;
    margin-bottom: 4px;
    border-radius: 50%;
    background: var(--soft-line);
    color: var(--ink);
  }

  .matrix-cell--decision {
    background: var(--accent-soft);
    color: var(--ink);
    font-weight: 680;
  }

  .matrix-cell--decision strong {
    background: var(--brand-accent);
    color: white;
  }

  .matrix-readout {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 14px;
    align-items: center;
    padding: 0 14px;
    color: white;
    background: var(--brand-primary);
    font-size: 13px;
  }

  .matrix-readout strong {
    color: color-mix(in srgb, white 66%, transparent);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
</style>

<template data-template-body>
  <section
    class="matrix-wrap"
    data-primary-block
    data-audit-container
    data-encoding="position color"
    aria-label="同维比较矩阵"
  >
    <div class="matrix-legend" data-annotation data-audit="annotation">
      <span>请替换：统一口径、单位与时间</span>
      <span class="legend-scale">
        <span><i class="legend-swatch"></i>一般</span>
        <span><i class="legend-swatch legend-swatch--high"></i>决策性差异</span>
      </span>
    </div>

    <div class="matrix">
      <div class="matrix-head">比较对象</div>
      <div class="matrix-head" data-dimension>维度 A</div>
      <div class="matrix-head" data-dimension>维度 B</div>
      <div class="matrix-head" data-dimension>维度 C</div>
      <div class="matrix-head">决策含义</div>

      <div class="matrix-entity" data-entity>选项 A<small>请替换定位</small></div>
      <div class="matrix-cell" data-data-point data-source-ref="S1"><strong>●</strong>证据 A1</div>
      <div class="matrix-cell" data-data-point data-source-ref="S1"><strong>●</strong>证据 A2</div>
      <div class="matrix-cell" data-data-point data-source-ref="S2"><strong>●</strong>证据 A3</div>
      <div class="matrix-cell matrix-cell--decision" data-decision><strong>01</strong>请替换结论</div>

      <div class="matrix-entity" data-entity>选项 B<small>请替换定位</small></div>
      <div class="matrix-cell" data-data-point data-source-ref="S2"><strong>●</strong>证据 B1</div>
      <div class="matrix-cell" data-data-point data-source-ref="S2"><strong>●</strong>证据 B2</div>
      <div class="matrix-cell" data-data-point data-source-ref="S3"><strong>●</strong>证据 B3</div>
      <div class="matrix-cell">请替换边界</div>

      <div class="matrix-entity" data-entity>选项 C<small>请替换定位</small></div>
      <div class="matrix-cell" data-data-point data-source-ref="S3"><strong>●</strong>证据 C1</div>
      <div class="matrix-cell" data-data-point data-source-ref="S3"><strong>●</strong>证据 C2</div>
      <div class="matrix-cell" data-data-point data-source-ref="S3"><strong>●</strong>证据 C3</div>
      <div class="matrix-cell">请替换边界</div>
    </div>

    <div class="matrix-readout" data-annotation data-audit="annotation">
      <strong>Reading order</strong>
      <span>请替换：说明比较顺序与边界；建议置尾。</span>
    </div>
  </section>
</template>
