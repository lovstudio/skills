<style data-template-style>
  .small-multiples {
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: minmax(0, 1fr) 48px;
    gap: 14px;
  }

  .multiple-panel {
    min-width: 0;
    display: grid;
    grid-template-rows: 36px minmax(0, 1fr) 44px;
    gap: 8px;
    padding: 10px 14px 0;
    border-top: 2px solid var(--ink);
    border-bottom: 1px solid var(--line);
  }

  .multiple-panel h2 {
    margin: 0;
    font-size: 14px;
    line-height: 1.2;
  }

  .mini-chart {
    min-height: 0;
    display: flex;
    align-items: end;
    justify-content: center;
    gap: 18px;
    border-bottom: 1px solid var(--ink);
    padding: 10px 12px 0;
  }

  .mini-bar {
    width: 32%;
    min-height: 24px;
    display: grid;
    justify-items: center;
    padding-top: 7px;
    color: white;
    background: var(--brand-primary);
    font-size: 11px;
    font-weight: 720;
  }

  .mini-bar--accent { background: var(--brand-accent); }

  .multiple-panel p {
    margin: 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
  }

  .multiple-readout {
    grid-column: 1 / 4;
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 14px;
    align-items: center;
    padding: 0 15px;
    color: white;
    background: var(--brand-primary);
    font-size: 12px;
  }

  .multiple-readout strong {
    color: var(--brand-accent);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
</style>

<template data-template-body>
  <section
    class="small-multiples"
    data-primary-block
    data-audit-container
    data-encoding="length position"
    aria-label="小倍图"
  >
    <article class="multiple-panel" data-panel>
      <h2>对象 A</h2>
      <div class="mini-chart">
        <span class="mini-bar" data-data-point data-source-ref="S1" style="height:42%">42</span>
        <span class="mini-bar mini-bar--accent" data-data-point data-source-ref="S1" style="height:68%">68</span>
      </div>
      <p data-annotation>请替换：同口径变化及驱动</p>
    </article>

    <article class="multiple-panel" data-panel>
      <h2>对象 B</h2>
      <div class="mini-chart">
        <span class="mini-bar" data-data-point data-source-ref="S2" style="height:56%">56</span>
        <span class="mini-bar mini-bar--accent" data-data-point data-source-ref="S2" style="height:74%">74</span>
      </div>
      <p data-annotation>请替换：同口径变化及驱动</p>
    </article>

    <article class="multiple-panel" data-panel>
      <h2>对象 C</h2>
      <div class="mini-chart">
        <span class="mini-bar" data-data-point data-source-ref="S3" style="height:38%">38</span>
        <span class="mini-bar mini-bar--accent" data-data-point data-decision data-source-ref="S3" style="height:82%">82</span>
      </div>
      <p data-annotation>请替换：同口径变化及驱动</p>
    </article>

    <div class="multiple-readout" data-annotation data-audit="annotation">
      <strong>Shared scale</strong>
      <span data-unit>请替换统一单位、时间与尺度；标出跨面板差异。</span>
    </div>
  </section>
</template>
