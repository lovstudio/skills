<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --brand-primary: {{BRAND_PRIMARY}};
      --brand-accent: {{BRAND_ACCENT}};
      --ink: {{BRAND_INK}};
      --muted: {{BRAND_MUTED}};
      --paper: {{BRAND_PAPER}};
      --line: color-mix(in srgb, var(--ink) 18%, transparent);
      --soft-line: color-mix(in srgb, var(--ink) 9%, transparent);
      --accent-soft: color-mix(in srgb, var(--brand-accent) 10%, var(--paper));
      --font: {{FONT_FAMILY}};
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #d7d7d5;
      color: var(--ink);
      font-family: var(--font);
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
    }

    .poster {
      width: {{CANVAS_WIDTH}}px;
      height: {{CANVAS_HEIGHT}}px;
      padding: 32px 54px 26px;
      overflow: hidden;
      display: grid;
      grid-template-rows: 32px minmax(88px, auto) minmax(0, 1fr) 48px 42px;
      gap: 10px;
      background: var(--paper);
      box-shadow: 0 28px 70px rgb(18 28 45 / 16%);
    }

    .poster[data-title-mode="action"] {
      grid-template-rows: 32px minmax(88px, auto) minmax(0, 1fr) 42px;
      gap: 12px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 8px;
    }

    .figure-label {
      margin: 0;
      color: var(--brand-accent);
      font-size: 13px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .brand-lockup img {
      width: 132px;
      max-height: 26px;
      object-fit: contain;
      object-position: right center;
    }

    .header {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 32%);
      gap: 42px;
      align-items: end;
      padding: 2px 0 10px;
    }

    .poster__title {
      margin: 0;
      max-width: 1040px;
      font-size: 41px;
      line-height: 1.12;
      font-weight: 760;
      letter-spacing: -.025em;
      text-wrap: balance;
    }

    .deck {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.42;
      font-weight: 460;
    }

    .visual {
      min-height: 0;
      position: relative;
      border-top: 1px solid var(--line);
      padding-top: 13px;
    }

    .recommendation {
      min-height: 0;
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr);
      gap: 18px;
      align-items: center;
      padding: 0 16px;
      color: white;
      background: var(--brand-primary);
    }

    .recommendation strong {
      color: var(--brand-accent);
      font-size: 11px;
      line-height: 1;
      font-weight: 780;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .recommendation p {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 650;
    }

    .footer {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, auto);
      gap: 28px;
      align-items: end;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .source-note,
    .generation-note {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.34;
    }

    .generation-note {
      text-align: right;
    }

    .site {
      color: var(--ink);
      font-weight: 650;
    }

    {{TEMPLATE_STYLE}}

    .poster[data-title-mode="topic"] :is(
      .matrix-readout,
      .roadmap-readout,
      .multiple-readout
    ) {
      color: var(--muted);
      background: transparent;
      border-top: 1px solid var(--line);
    }

    .poster[data-title-mode="topic"] :is(
      .matrix-readout,
      .roadmap-readout,
      .multiple-readout
    ) strong {
      color: var(--brand-accent);
    }

    .poster[data-aspect="4:5"],
    .poster[data-aspect="1:1"],
    .poster[data-aspect="A4"] {
      grid-template-rows: 38px minmax(150px, auto) minmax(0, 1fr) 62px 62px;
      padding: 44px 52px 30px;
      gap: 16px;
    }

    .poster[data-title-mode="action"][data-aspect="4:5"],
    .poster[data-title-mode="action"][data-aspect="1:1"],
    .poster[data-title-mode="action"][data-aspect="A4"] {
      grid-template-rows: 38px minmax(150px, auto) minmax(0, 1fr) 62px;
    }

    .poster[data-aspect="4:5"] .header,
    .poster[data-aspect="1:1"] .header,
    .poster[data-aspect="A4"] .header {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media print {
      html,
      body { background: transparent; }
      .poster { box-shadow: none; }
    }
  </style>
</head>
<body>
  <article
    class="poster"
    data-aspect="{{ASPECT}}"
    data-template="{{TEMPLATE_NAME}}"
    data-mode="{{EVIDENCE_MODE}}"
    data-title-mode="{{TITLE_MODE}}"
  >
    <div class="topline">
      <p class="figure-label">Exhibit 01 · {{TEMPLATE_NAME}}</p>
      <div class="brand-lockup">
        <img src="{{BRAND_LOGO_DATA_URL}}" alt="{{BRAND_NAME}} Logo">
      </div>
    </div>

    <header class="header" data-region="header">
      <h1 class="poster__title" data-audit="title">{{TITLE}}</h1>
      <p class="deck" data-audit="description">
        请替换：用一句话说明口径、对象或阅读方法；若标题已经足够完整，删除本段。
      </p>
    </header>

    <main class="visual" data-region="visual">
      {{VISUAL_BODY}}
    </main>

    {{RECOMMENDATION_BLOCK}}

    <footer class="footer" data-region="footer">
      <p class="source-note" data-audit="source">
        来源：请替换为真实来源、时间、单位与限定；使用 S1、S2 将图中标记映射到证据台账。
      </p>
      <p class="generation-note" data-audit="attribution">
        {{COPYRIGHT}} · <span class="site">{{SITE}}</span>
      </p>
    </footer>
  </article>

  <script>
    document.fonts.ready.finally(() => {
      window.__INFOGRAPHIC_READY__ = true;
    });
  </script>
</body>
</html>
