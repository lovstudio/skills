schema: skill-manifest/v1
id: lov-normalize-tauri-app-icon
version: "0.1.1"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-normalize-tauri-app-icon
    persist:
      enabled: true
      namespace: skills.lov-normalize-tauri-app-icon
      records_path: skills.lov-normalize-tauri-app-icon.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要用户身份，请提供名称。
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要品牌身份，请提供品牌名称。
      - path: brand.site
        required: false
        question: 如果需要品牌官网，请提供地址。
      - path: brand.tone
        required: false
        question: 如果已有品牌语气或审美关键词，请提供它们。
      - path: workspace.project_root
        required: false
        question: 需要检查哪个 Tauri 项目目录？
      - path: records.default_visible_ratio
        required: false
        question: 是否要长期复用一个默认的图标可见外框比例？
      - path: records.reference_icon_role
        required: false
        question: 是否要长期记录某个参考图标的用途，而不保存其本地路径？
  preferences:
    namespace: lov_normalize_tauri_app_icon
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
  interaction:
    ask_missing: true
    max_questions: 1
