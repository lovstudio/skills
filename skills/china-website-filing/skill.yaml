schema: skill-manifest/v1
id: lov-china-website-filing
version: "0.2.0"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-china-website-filing
    persist:
      enabled: true
      namespace: skills.lov-china-website-filing
      records_path: skills.lov-china-website-filing.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.name
        aliases:
          - identity.name
        required: false
        question: 需要以哪位负责人身份办理？
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 巡检记录使用哪个时区？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 网站主办单位或个人名称是什么？
      - path: brand.site
        required: false
        question: 本次备案或上线的域名是什么？
      - path: brand.tone
        required: false
        question: 如需生成用户可见说明，沿用什么品牌语气？
  preferences:
    namespace: lov_china_website_filing
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 巡检和期限按哪个时区计算？
  interaction:
    ask_missing: true
    max_questions: 1
