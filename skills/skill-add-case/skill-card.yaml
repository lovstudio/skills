schema: lovstudio/skill-card/v1
version: "0.2.2"
description: >-
  Convert one accepted Skill result into a public summary plus a server-priced
  paid full-session evidence page, then update and verify the owning source.
owner:
  team: "LovStudio Skill contributors"
  contact: "Source repository maintainers"
license:
  name: MIT
  terms: "Use, modify, and redistribute under the included MIT License."
  url: "LICENSE"
use_case:
  audience: "Skill users, maintainers, and catalog editors"
  scenario: "A completed Skill result has explicit approval for a public summary and a paid, redacted full Session."
  tasks:
    - "Qualify the exact accepted result and redact private data."
    - "Append one deduplicated case to the owning Skill."
    - "Upload the complete Session through lov-share-session at one tenth of the target Skill price."
    - "Verify source publication and the live LovStudio detail page when applicable."
deployment:
  geography: global
  environments:
    - "Local agent workspace with access to the target Skill source"
    - "GitHub and LovStudio network access for optional public synchronization"
requirements:
  credentials: "LovStudio authentication for paid Session upload; repository credentials only for public sync."
  dependencies:
    - "lov-share-session"
  runtime:
    - "Python 3.10 or newer"
    - "PyYAML for generated source validation"
risks:
  - risk: "A merely successful command could be misrepresented as a user-approved case."
    mitigation: "Require explicit acceptance tied to the exact result before any mutation."
  - risk: "A public case could leak secrets, private paths, transcript content, or customer data."
    mitigation: "Fail on high-risk patterns, require a privacy note, inspect the final diff, and publish only approved evidence."
  - risk: "A client-selected price or public attachment URL could bypass the intended paid access contract."
    mitigation: "Accept pricing only from the server and reject attachments in paid Session uploads."
  - risk: "A push or cache response could be mislabeled as a live website update."
    mitigation: "Verify both public raw JSON fingerprint and HTTP 200 detail-page marker before reporting live-verified."
references:
  - title: "Primary Skill instructions"
    path: "SKILL.md"
  - title: "Case contract"
    path: "references/case-contract.md"
  - title: "Composition analysis"
    path: "references/skill-composition.md"
output:
  types:
    - "validated Skill case record"
    - "paid full-session evidence URL"
    - "public synchronization evidence"
  formats:
    - "JSON"
    - "plain-text status report"
  parameters:
    - "target Skill source"
    - "accepted case JSON object"
    - "current or explicit Agent Session"
    - "optional public cases and detail-page URLs"
  validation:
    - "explicit user-confirmed evidence"
    - "accepted final image required for primarily visual cases"
    - "atomic append with duplicate ID and fingerprint rejection"
    - "server-derived Session price and paid paywall readback"
    - "target Skill source validation"
    - "public JSON fingerprint and detail-page marker readback"
    - "rendered-page image references and non-empty image content"
  description: "One truthful public case, one paid full Session, and exact local, pushed, and live states."
ethical_considerations: >-
  The workflow minimizes public data, requires user acceptance, rejects obvious
  credentials and private paths, and does not manufacture testimonials, metrics,
  artifacts, or publication status.
dimensions:
  - id: evidence-integrity
    label: "Evidence integrity"
    description: "Ties a real input, minimum prompt, real output, verification method, and explicit acceptance to one case."
    evidence: "The first case records the direct request and the concrete source and verification helpers created from it."
    score: "source-verified"
  - id: privacy
    label: "Publication privacy"
    description: "Prevents obvious secrets and private absolute paths from entering public case data."
    evidence: "The deterministic helper scans canonical case JSON and validates all relative case assets inside the target root."
    score: "source-verified"
  - id: mutation-safety
    label: "Mutation safety"
    description: "Preserves valid existing cases and rejects duplicates before an atomic replacement."
    evidence: "Dry-run and write modes share validation, content fingerprints, duplicate gates, and atomic os.replace output."
    score: "source-verified"
  - id: paid-session-integrity
    label: "Paid Session integrity"
    description: "Links the accepted case to a redacted full transcript at a server-authoritative Credits price."
    evidence: "The composed helper validates target Skill and case IDs, rejects client pricing, and writes only after upload succeeds."
    score: "source-verified"
  - id: live-truthfulness
    label: "Live-state truthfulness"
    description: "Separates local, pushed, and live-verified states."
    evidence: "The public verifier matched the canonical case SHA-256 and found the expected marker on the HTTP 200 LovStudio detail page on 2026-08-23."
    score: "live-verified"
pricing:
  model: free
  currency: CNY
  list_price_cny: 0
  basis: "A small evidence utility improves the credibility of the wider public Skill catalog."
  boundary: "Includes case maintenance and verification; excludes unauthorized repository or catalog creation."
  review_trigger: "Revisit if the public case schema or LovStudio synchronization contract changes."
  confidence: internal
distribution:
  paid:
    - "workbuddy: not planned"
    - "skillpay: not planned"
  free:
    - "github: v0.1.0 published; v0.2.2 local-only"
    - "lovstudio: v0.1.0 live-verified 2026-08-23"
