basis: "LovStudio 官网目录免费条目（0 Credits），本地使用同样免费。lov-skill-pricing 评估六维加权 2.88/5：证据只有一场真实会议；输入是不登录就能打开的分享页，把纪要粘给通用助手等替代做法免费；没有付费的上游依赖。可比对象是同系列的微信工作搭子（付费，268 Credits，六维加权 3.49/5）。先以免费入口积累使用证据，微信里的跟进交给微信工作搭子。"
