schema: skill-manifest/v1
id: lov-image-creator
version: 0.3.1
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
    - user
    - brand
    - workspace
    - preferences
    - skills.lov-image-creator
    persist:
      enabled: true
      namespace: skills.lov-image-creator
      records_path: skills.lov-image-creator.records
      write_policy: direct-user-statement
      atomic: true
    fields:
    - path: user.name
      aliases:
      - identity.name
      required: false
      question: 如果本次输出需要用户身份，请提供名称。
    - path: user.language
      required: false
      question: 希望使用哪种语言输出？
    - path: user.timezone
      required: false
      question: 需要使用哪个时区处理日期和时间？
    - path: brand.name
      aliases:
      - identity.name
      required: false
      question: 如果本次输出需要品牌身份，请提供品牌名称。
    - path: brand.site
      required: false
      question: 如果需要品牌官网，请提供地址。
    - path: brand.tone
      required: false
      question: 如果已有品牌语气或审美关键词，请提供它们。
    - path: identity.name
      required: true
      question: 如果本次输出需要品牌身份，请提供品牌名称。
    - path: identity.logo
      required: false
      question: 如果需要使用品牌 Logo，请提供 Logo 地址或文件路径。
    - path: workspace.project_root
      required: false
      question: 目标项目路径是什么？
    - path: workspace.output_dir
      required: false
      question: 输出保存在哪里？
    - path: workspace.knowledge_root
      required: false
      question: 本次知识库路径是什么？
    - path: skills.lov-image-creator.profile
      required: false
      question: 本 Skill 有哪些明确配置？
  preferences:
    namespace: lov_image_creator
    fields:
    - path: user.language
      required: false
      question: 希望使用哪种语言输出？
    - path: user.timezone
      required: false
      question: 需要使用哪个时区处理日期和时间？
  interaction:
    ask_missing: true
    max_questions: 1
