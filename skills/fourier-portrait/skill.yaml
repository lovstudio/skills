schema: skill-manifest/v1
id: lov-fourier-portrait
version: "0.1.0"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-fourier-portrait
    persist:
      enabled: true
      namespace: skills.lov-fourier-portrait
      records_path: skills.lov-fourier-portrait.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要用户身份，请提供名称。
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要品牌身份，请提供品牌名称。
      - path: brand.site
        required: false
        question: 如果需要品牌官网，请提供地址。
      - path: brand.tone
        required: false
        question: 如果已有品牌语气或审美关键词，请提供它们。
      - path: skills.lov-fourier-portrait.records.photo
        required: false
        question: 用哪张照片来画？请给出照片路径。
      - path: brand.logo
        aliases:
          - skills.lov-fourier-portrait.records.logo
        required: false
        question: 片尾要放 Logo 吗？如果要，请给出浅色版 PNG 路径。
      - path: skills.lov-fourier-portrait.records.title
        required: false
        question: 画面顶部的标题用什么？不需要可以留空。
      - path: skills.lov-fourier-portrait.records.output_dir
        aliases:
          - workspace.output_dir
        required: false
        question: 成片保存到哪个目录？
      - path: skills.lov-fourier-portrait.records.mode
        required: false
        question: 用双链（xy）还是单链（complex）？
  preferences:
    namespace: lov_fourier_portrait
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
  interaction:
    ask_missing: true
    max_questions: 1
