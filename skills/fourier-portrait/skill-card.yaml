schema: lovstudio/skill-card/v1
version: "0.1.0"
description: "Turns a single-person photo into a vertical Fourier epicycle video: the photo dissolves into line art, rotating circles redraw the whole face as one continuous line while the number of terms grows from 1 to 1024, and the video ends on the line art with the series formulas."
owner:
  team: "Lovstudio.AI"
  contact: "https://lovstudio.ai"
license:
  name: MIT
  terms: "The Skill source may be used and modified under MIT. Users remain responsible for photo rights, consent, fonts and logos they supply, and the final use of the video."
  url: "LICENSE"
use_case:
  audience: "Creators and agents who want a math-visualization short video built from their own portrait."
  scenario: "Recreate the popular rotating-circles portrait clip with the user's own photo, for a short-video post, a talk opener or a personal brand piece."
  tasks:
    - "Segment the subject and crop a head-and-shoulders bust from the face position."
    - "Convert the photo into clean line art that survives print halftone, colour casts and textured clothing."
    - "Join every contour into one closed path without long connector strokes."
    - "Compute the Fourier series and render staged passes with errors, formulas and safe areas."
    - "Produce QC stills, contact sheets and a metrics report before delivery."
deployment:
  geography: global
  environments:
    - "Agent runtime with shell access, uv or Python 3.10 or newer, and ffmpeg."
    - "macOS 14 or newer with Swift for on-device subject segmentation and face crop; other systems use the full frame or an explicit crop."
requirements:
  credentials: "none"
  dependencies:
    - "numpy, opencv-python-headless, scipy, skia-python and matplotlib, resolved by uv from the script header"
    - "ffmpeg and ffprobe"
    - "PyYAML for the bundled profile and validation scripts"
  runtime:
    - "Image viewing for QC"
    - "Python 3.10 or newer"
    - "Optional Apple Vision through the Swift command-line interpreter"
risks:
  - risk: "Noisy or low-contrast photos produce blotchy line art and an unrecognizable face."
    mitigation: "Render QC stills first, check named facial features, and tune offset, speck size and crop as documented before rendering the video."
  - risk: "Without macOS Vision the background and clothing enter the line art."
    mitigation: "Report the fallback, and ask for a tighter explicit crop or a photo with a plain background."
  - risk: "On-screen copy may overstate or misdescribe the person."
    mitigation: "Keep the title to one factual line and apply lov-branding-consistency; never invent claims about the subject."
  - risk: "A silent video may be mistaken for a finished post."
    mitigation: "Report the missing audio explicitly and hand music to an editing step instead of synthesizing it in code."
references:
  - title: "Primary Skill instructions"
    path: "SKILL.md"
  - title: "Prior art and technique"
    path: "references/prior-art.md"
  - title: "Tuning guide"
    path: "references/tuning.md"
  - title: "Skill composition record"
    path: "references/skill-composition.md"
output:
  types:
    - "Vertical math-animation video"
    - "line-art image"
    - "QC stills and contact sheets"
    - "metrics report"
  formats:
    - "MP4 (H.264, 1080x1920, 30 fps, no audio)"
    - "PNG"
    - "JPEG"
    - "JSON"
  parameters:
    - "photo, title, logo, mode (xy or complex), crop, line-art threshold, stages and stage durations"
  validation:
    - "recognizable facial features in the line art"
    - "final reconstruction error under 1 percent"
    - "ffprobe resolution, codec and duration"
    - "vertical safe areas clear of text and logo"
  description: "A silent vertical video plus the line art, contact sheets and a report of per-stage errors and the fitted coefficient decay."
ethical_considerations: "Process only photos the user is authorized to use. Everything runs locally and no photo is uploaded. Do not publish the video or use it as an account avatar without a separate request, and do not present the generated line art as an original artwork by a third party."
dimensions:
  - id: line_art_fidelity
    label: "Line-art fidelity"
    description: "The traced line art keeps the person's recognizable features and drops noise."
    evidence: "On the recorded case the glasses, open mouth, beard, ear, collar microphone and headwear survived as 85 clean contours, while purple halftone, background shapes and the shirt print were removed by segmentation, bilateral filtering and crop. Not yet tested on a second person."
    score: null
  - id: reconstruction_accuracy
    label: "Reconstruction accuracy"
    description: "The epicycle drawing converges to the target path and the reported numbers are real."
    evidence: "Measured relative error fell from 70.09 percent at N=1 to 0.16 percent at N=1024 in xy mode and to 0.40 percent in complex mode; the fitted decay exponent 1.45 matches the value printed in the reference clip."
    score: null
  - id: reference_fidelity
    label: "Reference look"
    description: "The video reproduces the visual grammar of the reference clip."
    evidence: "Side-by-side frames show the same two-chain layout, dashed projections, N and error labels, faint target behind the trail and closing formula card; title, logo and safe areas were added for vertical publishing."
    score: null
  - id: efficiency
    label: "Render efficiency"
    description: "Iteration and final renders are fast enough to tune interactively."
    evidence: "QC stills take about 3 seconds; the 38.9-second 1080x1920 video rendered in 14.7 seconds on Apple silicon, and a fresh uv environment added about 45 seconds once. Repeated renders produced byte-identical files."
    score: null
pricing:
  model: free
  currency: CNY
  list_price_cny: 0
  basis: "Runs fully locally with open-source libraries and needs no paid model; the pricing pass scored it 2.5 out of 5, so it starts as a free entry until external use shows otherwise."
  boundary: "Includes line art, Fourier path, rendered silent video, QC stills, contact sheets and report. Excludes music, voice-over, covers, publishing and rights clearance."
  review_trigger: "Reassess after 100 verified external uses, five verified cases on different people, or when hosted rendering, music or batch processing is added."
  confidence: internal
distribution:
  paid: []
  free:
    - github
    - lovstudio
