schema: skill-manifest/v1
id: lov-share-session
version: "0.5.0"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-share-session
    persist:
      enabled: true
      namespace: skills.lov-share-session
      records_path: skills.lov-share-session.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要用户身份，请提供名称。
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要品牌身份，请提供品牌名称。
      - path: brand.site
        required: false
        question: 如果需要品牌官网，请提供地址。
      - path: brand.tone
        required: false
        question: 如果已有品牌语气或审美关键词，请提供它们。
  preferences:
    namespace: lov_session_share
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: skills.lov-share-session.records.standing_public_upload_consent
        required: false
        question: 主动调用 lov-share-session 时，是否默认同意将当次脱敏会话公开上传到 lovstudio.ai？
  interaction:
    ask_missing: true
    max_questions: 1
