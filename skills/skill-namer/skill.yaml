schema: skill-manifest/v1
id: lov-skill-namer
version: 0.1.0
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
    - user
    - brand
    - workspace
    - preferences
    - skills.lov-skill-namer
    persist:
      enabled: true
      namespace: skills.lov-skill-namer
      records_path: skills.lov-skill-namer.records
      write_policy: direct-user-statement
      atomic: true
    fields:
    - path: user.language
      required: false
      question: 希望使用哪种语言命名？
    - path: brand.tone
      required: false
      question: 已有命名语气或风格范例是什么？
    - path: preferences.naming_style
      required: false
      question: 是否有本项目需要沿用的命名风格？
    - path: skills.lov-skill-namer.records.naming_style
      required: false
      question: 是否有希望长期沿用的命名原则？
    - path: skills.lov-skill-namer.records.approved_names
      required: false
      question: 哪些名称已经明确认可？
  preferences:
    namespace: lov_skill_namer
    fields:
    - path: user.language
      required: false
      question: 希望使用哪种语言命名？
  interaction:
    ask_missing: true
    max_questions: 1
name_zh: Skill 命名大师
display_name: "Skill 命名大师"
display_name_en: "Skill Naming Master"
