schema: skill-manifest/v1
id: lov-voice2srt
version: "0.1.1"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-voice2srt
    persist:
      enabled: true
      namespace: skills.lov-voice2srt
      records_path: skills.lov-voice2srt.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要用户身份，请提供名称。
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要品牌身份，请提供品牌名称。
      - path: brand.site
        required: false
        question: 如果需要品牌官网，请提供地址。
      - path: brand.tone
        required: false
        question: 如果已有品牌语气或审美关键词，请提供它们。
  preferences:
    namespace: lov_voice2srt
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: skills.lov-voice2srt.records.preferred_provider
        required: false
        question: 默认使用哪个 ASR provider？
      - path: skills.lov-voice2srt.records.vocabulary_policy
        required: false
        question: 默认是否复用个人词库？
  interaction:
    ask_missing: true
    max_questions: 1
