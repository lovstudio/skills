schema: skill-manifest/v1
id: lov-organize-storage
version: "0.1.0"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-organize-storage
    persist:
      enabled: true
      namespace: skills.lov-organize-storage
      records_path: skills.lov-organize-storage.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要用户身份，请提供名称。
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要品牌身份，请提供品牌名称。
      - path: brand.site
        required: false
        question: 如果需要品牌官网，请提供地址。
      - path: brand.tone
        required: false
        question: 如果已有品牌语气或审美关键词，请提供它们。
      - path: workspace.project_root
        required: false
        question: 本次要整理的目标存储盘或归档根目录是什么？
      - path: workspace.output_dir
        required: false
        question: 迁移计划、日志和报告保存到哪里？
      - path: skills.lov-organize-storage.profile
        required: false
        question: 本 Skill 有哪些明确配置？
  preferences:
    namespace: lov_organize_storage
    fields:
      - path: user.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
  interaction:
    ask_missing: true
    max_questions: 1
