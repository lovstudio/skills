    basis_en: The six-dimension judgment scores 3.15/5; easy replication, one case, and an agreement below its own gate favor a free entry subsidized by the maintainer.
    boundary_zh: 覆盖互动量化、语义分层、三张图形与隐私自查；不含微信取数能力、心理咨询与关系建议，也不输出对他人的评价或判决句。
    boundary_en: Covers interaction metrics, semantic layering, three figures, and the privacy self-check; excludes WeChat data access, counselling, and any judgement of third parties.
