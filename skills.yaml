    delivery_unit_en: Public Skill source, the metrics and semantic-layering scripts, the calibration protocol, three figure generators, and one real case record
    value_zh: 把「数条数」升级成语义分层：先判掉没有话题的消息，再区分工作／情感／生活，并强制在结论里同时给出模型、一致率与反证。
