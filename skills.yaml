  description: Build content-led interfaces with consistent controls, GSAP motion,
    working multimedia, and traceable acceptance evidence.
  tagline_en: Turn real content and existing code into distinctive, usable interfaces
    with verified interactions and media.
  tagline_zh: 把真实内容和现有代码落实为有辨识度、交互一致、媒体可用的界面，并留下验收证据。
  depends_on:
  - branding-consistency
