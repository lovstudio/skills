    model: free_entry
    visibility: public
    list_price_credits: 0
    launch_price_credits: 0
    price_range_credits:
    - 0
    - 0
    delivery_unit_zh: 公开设计方法、Profile 工具、参考文档和三个案例记录
    delivery_unit_en: Public design workflow, Profile tools, references, and three
      case records
    value_zh: 将内容适配、控件语义、GSAP、图片音视频和真实访问路径验收纳入同一个前端设计工作流。
    value_en: Bring content direction, control semantics, GSAP, images, audio, video,
      and real navigation checks into one frontend workflow.
    anchor_zh: 价值来自可复用方法与可追溯案例；尚无可靠的跨项目省时测量，不承诺固定节省时间。
    anchor_en: Value comes from reusable methods and traceable cases; cross-project
      time savings have not been measured reliably.
    basis_zh: 六维加权判断为 2.975/5；公开方法替代较多且证据仍有限，由维护者承担当前成本，作为免费入口。
    basis_en: The six-dimension judgment scores 2.975/5; alternatives and evidence
      gaps favor a free entry subsidized by the maintainer.
    boundary_zh: 覆盖页面、组件、导航和多媒体展示；不含模型费用、素材采购、媒体生成、托管、定制开发或代发布。
    boundary_en: Covers pages, components, navigation, and multimedia presentations;
      excludes model fees, media procurement or generation, hosting, custom development,
      and managed publishing.
    maintenance_zh: 根据真实使用反馈、浏览器与工具变化维护，不承诺付费支持时效。
    maintenance_en: Maintain against real usage feedback and browser or tool changes,
      without a paid support SLA.
    confidence: case-backed
    review_trigger_zh: 累计 10 次跨项目真实使用、版本变化、维护负担明显增加或加入托管服务时复评。
    review_trigger_en: Review after ten real cross-project uses, a version change,
      substantially higher maintenance, or hosted services.
    card_path: pricing-cards/frontend-design.md
- name: env-management
  runtime_name: lov-env-management
  display_name: Credential Keeper
  repo: lovstudio/env-management-skill
  name_zh: 凭据管家
  paid: false
  category: Dev Tools
  version: 0.2.0
  updated_at: 2026-08-23 17:04:16+00:00
  description: Manage multiple platforms, accounts, and rotating API Keys with lifecycle
    evidence, guarded zsh or user-session projection, audits, and a redacted local
    Dashboard.
  tagline_en: Track every account and rotating Key, select one binding per environment
    target, and keep secrets off the Dashboard.
  tagline_zh: 用平台、账号与 Key 账本管理轮换和有效期，为每个环境目标只选择一个生效 Key，并保持 Dashboard 全程脱敏。
  related:
  - install-ai
  - clash-tun-doctor
  pricing:
    model: free_entry
    visibility: public
    list_price_credits: 0
    launch_price_credits: 0
    price_range_credits:
    - 0
    - 0
    delivery_unit_zh: 公开 Skill 源码与当前版本说明
    delivery_unit_en: Public Skill source and current-version notes
    value_zh: 按“平台 → 账号 → Key”管理轮换、有效期与验证状态，并将唯一选中的 Key 安全投影到 zsh 或当前用户会话。
    value_en: Manage rotation, expiry, and validation by platform, account, and Key,
      then safely project one selected Key into zsh or the current user session.
    anchor_zh: 合格开发者可保守节省约 2–5 小时的配置与轮换时间，并降低账号混用、Key 过期和意外泄露风险。
    anchor_en: A qualified developer can conservatively save about 2–5 hours of setup
      and rotation work while reducing account mix-ups, expired Keys, and accidental
      disclosure.
    basis_zh: 六维加权得分为 3.59/5，但完整本地源码易复制，当前证据以 7 项合成凭据测试为主；官网先作为免费信任入口。
    basis_en: The six-dimension weighted score is 3.59/5, but the complete local source
      is easy to copy and current evidence is mainly seven synthetic-credential tests,
      so the website starts as a free trust entry.
    boundary_zh: 包含本地 registry、Keychain/文件 vault/1Password/现有环境变量来源、HTTPS probe、binding、环境投影、审计和脱敏
      Dashboard；不含托管团队 vault、自动定时验证、云 Secret 发布或企业合规报表。
    boundary_en: Includes a local registry, Keychain/file-vault/1Password/existing-environment
      sources, HTTPS probes, bindings, environment projection, audits, and a redacted
      Dashboard; excludes hosted team vaults, scheduled validation, cloud-secret publication,
      and enterprise compliance reports.
    maintenance_zh: 随操作系统凭据后端、平台验证契约和真实使用反馈复评。
    maintenance_en: Review against operating-system credential backends, provider
      validation contracts, and real usage feedback.
    confidence: case-backed
    review_trigger_zh: 达到 20 个活跃外部安装和 3 个非合成案例，或加入团队同步、定时验证、企业策略、托管服务或合规报表时复评。
    review_trigger_en: Review after 20 active external installs and three non-synthetic
      cases, or when team sync, scheduled validation, enterprise policy, hosted service,
      or compliance reporting is added.
    card_path: pricing-cards/env-management.md
- name: image-translation-errata
