name: Render index

on:
  push:
    branches: [main]
    paths:
      - "skills.yaml"
      - "scripts/render-readme.py"
      - "scripts/render-marketplace.py"
      - "scripts/sync-skills.py"
      - "scripts/skill_display_names.py"
      - "scripts/sync-runtime-names.py"
      - "scripts/mirror-catalog-cn.py"
      - "module-display-names.yaml"
      - "README.md"
      - "README.en.md"
      - ".github/workflows/render-readme.yml"
  schedule:
    # Nightly: pull fresh descriptions from each skill repo's GitHub description,
    # and re-mirror every free skill so `npx skills add lovstudio/skills` sees
    # the latest SKILL.md content.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      gh_sync:
        description: "Sync descriptions from GitHub repo metadata"
        required: false
        default: "true"
        type: string
      mirror:
        description: "Re-mirror free skill repos into ./skills/"
        required: false
        default: "true"
        type: string

permissions:
  contents: write

concurrency:
  group: render-index
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Verify catalog rendering
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Mirror free skill repos
        id: mirror
        # Runs on schedule/dispatch (to pull upstream changes) and on push
        # (cheap: shallow clones, < 1 MB total today). The commit step below
        # no-ops if nothing actually changed.
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'push' ||
          inputs.mirror == 'true'
        # An entry that cannot be refreshed keeps its last mirror. Let the other
        # entries sync and publish; "Fail on stale mirrors" then fails the run.
        continue-on-error: true
        env:
          # Fine-grained token with read access to the private lovstudio/*-skill repos.
          # sync-skills.py fails in CI when it is empty instead of cloning anonymously.
          SKILLS_SOURCE_TOKEN: ${{ secrets.SKILLS_SOURCE_TOKEN }}
        run: python3 scripts/sync-skills.py

      - name: Sync runtime names and versions
        run: python3 scripts/sync-runtime-names.py --write

      - name: Render marketplace.json
        run: python3 scripts/render-marketplace.py

      - name: Render READMEs
        env:
          GH_SYNC: ${{ (github.event_name == 'schedule' || inputs.gh_sync == 'true') && '1' || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render-readme.py

      - name: Commit changes
        run: |
          git add -A README.md README.en.md .claude-plugin/marketplace.json skills.yaml skills/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-sync skills mirror + re-render index"
          git push

      - name: Fail on stale mirrors
        if: steps.mirror.outcome == 'failure'
        run: |
          echo "::error title=Stale skill mirrors::Mirror free skill repos reported errors, so some free skill mirrors were not refreshed. See that step's annotations and the job summary."
          exit 1

  mirror-cn:
    # lovstudio.cn reads skills.yaml from Aliyun OSS. Upload main's copy after every
    # render, even when it did not change: the site treats the object's
    # Last-Modified as this job's heartbeat.
    needs: render
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.ALIYUN_CATALOG_MIRROR_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Pick up the commit the render job may have just pushed.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml==6.0.3 alibabacloud-oss-v2==1.4.0

      - name: Assume the catalog mirror role (GitHub OIDC, no stored keys)
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          role-to-assume: ${{ vars.ALIYUN_CATALOG_MIRROR_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_GITHUB_OIDC_PROVIDER_ARN }}
          role-session-name: skills-catalog-mirror
          role-session-expiration: 900

      - name: Upload skills.yaml and verify the public copy
        run: python3 scripts/mirror-catalog-cn.py --apply
